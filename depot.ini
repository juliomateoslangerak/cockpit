[server]
ipAddress: 127.0.0.1
port: 7700

[40x]
type: cockpit.devices.objective.ObjectiveDevice
pixel_size: 1

[camera]
type: cockpit.devices.microscope_camera.MicroscopeCamera
uri: PYRO:camera@localhost:8000

[filterwheel]
type: cockpit.devices.microscope_device.MicroscopeFilter
uri: PYRO:filterwheel@localhost:8000
cameras: camera
filters:
  0, Blue, 460
  1, Green, 510
  2, Red, 620

[stage]
type: cockpit.devices.microscope_device.MicroscopeStage
uri: PYRO:stage@localhost:8000
x_axis_name: x
y_axis_name: y
z_axis_name: z
x_units_per_micron: 1
y_units_per_micron: 1
z_units_per_micron: 1
x_velocity: 1000
y_velocity: 1000
z_velocity: 300
x_settling_time: 10
y_settling_time: 10
z_settling_time: 10
movement_time: 0.03 0.03 0.01

